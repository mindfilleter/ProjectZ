[project]
name = "projectz"
version = "0.1.0"
description = "A Zelda-like adventure game."
authors = [
    { name = "wkmanire", email = "williamkmanire@gmail.com" },
    { name = "luis", email = "luismiguelmanire@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pygame-ce (>=2.5.6,<3.0.0)",
]

[tool.poetry]
packages = [{ include = "projectz", from = "src" }]


[tool.poetry.group.emacs.dependencies]
python-lsp-server = "^1.14.0"
python-lsp-ruff = "^2.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
mypy = "^1.19.1"
ruff = "^0.14.14"
pytest-cov = "^7.0.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-fail-under=85 --color=no"

[tool.coverage.run]
source = ["src/projectz"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
