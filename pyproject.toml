[project]
name = "projectz"
version = "0.1.0"
description = "A Zelda-like adventure game."
authors = [
    { name = "wkmanire", email = "williamkmanire@gmail.com" },
    { name = "luis", email = "luismiguelmanire@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "xdg (>=6.0.0,<7.0.0)",
    "pyxdg (>=0.28,<0.29)",
    "pyscroll (>=2.31,<3.0)",
    "pytmx (>=3.32,<4.0)",
]

[tool.poetry]
packages = [{ include = "projectz", from = "src" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
