[project]
name = "projectz"
version = "0.1.0"
description = "A Zelda-like adventure game."
authors = [
    { name = "wkmanire", email = "williamkmanire@gmail.com" },
    { name = "luis", email = "luismiguelmanire@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "xdg (>=6.0.0,<7.0.0)",
    "pyxdg (>=0.28,<0.29)",
    "pyscroll (>=2.31,<3.0)",
    "pytmx (>=3.32,<4.0)",
    "pathfinding (>=1.0.18,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "projectz", from = "src" }]


[tool.poetry.group.emacs.dependencies]
python-lsp-server = "^1.14.0"
python-lsp-ruff = "^2.1.0"

[tool.ruff]
line-length = 79
select = ["E", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
